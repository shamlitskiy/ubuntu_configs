<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual SQL Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #11151a;
        --panel-2: #141a21;
        --text: #e7edf3;
        --muted: #a0b3c1;
        --accent: #6aa9ff;
        --border: #1b232c;
        --ok: #2ecc71;
        --warn: #f39c12;
        --err: #e74c3c;
      }
      html, body { height: 100%; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        grid-template-rows: auto 1fr;
        grid-template-areas:
          "header header"
          "left right";
        height: 100vh;
      }
      header {
        grid-area: header;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #0e1116 0%, #0b0d10 100%);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header .title { font-weight: 600; letter-spacing: 0.2px; }
      header .spacer { flex: 1; }
      header .dialect { display: flex; align-items: center; gap: 8px; }
      select, input, button, textarea {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }
      button.primary { background: var(--accent); color: #0b0d10; border: none; }
      button.ghost { background: var(--panel); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .left {
        grid-area: left;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        overflow: auto;
        background: var(--panel-2);
      }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
      .card h3 { margin: 0 0 8px 0; font-size: 14px; font-weight: 600; color: var(--muted); }
      .row { display: flex; gap: 8px; align-items: center; }
      .col { display: flex; flex-direction: column; gap: 8px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .right { grid-area: right; padding: 16px; overflow: auto; }

      .sql-box { width: 100%; min-height: 280px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; line-height: 1.5; }
      .muted { color: var(--muted); font-size: 12px; }
      .pill { padding: 2px 8px; background: #0e1420; border: 1px solid #1a2333; border-radius: 999px; font-size: 12px; color: #a9c7ff; }
      .list { display: flex; flex-direction: column; gap: 6px; }
      .list .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
      .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #111415; border: 1px solid #1c252b; padding: 2px 6px; border-radius: 6px; color: #c7d6e5; }
      .danger { color: var(--err); }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <div class="title">Visual SQL — Standalone Demo</div>
        <span class="pill" id="schemaName">Demo schema</span>
        <div class="spacer"></div>
        <div class="dialect">
          <label for="dialect">Диалект</label>
          <select id="dialect">
            <option value="postgres">Postgres</option>
            <option value="mysql">MySQL</option>
            <option value="sqlite">SQLite</option>
          </select>
          <button id="formatBtn" class="ghost">Форматировать</button>
          <button id="copyBtn" class="ghost">Копировать</button>
          <button id="generateBtn" class="primary">Сгенерировать</button>
        </div>
      </header>
      <aside class="left">
        <div class="card">
          <h3>FROM</h3>
          <div class="row">
            <select id="fromTable"></select>
            <input id="fromAlias" placeholder="алиас (опц.)" />
          </div>
        </div>

        <div class="card">
          <h3>JOINs</h3>
          <div id="joins" class="list"></div>
          <button id="addJoin" class="ghost">+ добавить JOIN</button>
        </div>

        <div class="card">
          <h3>Столбцы</h3>
          <div id="columns" class="list"></div>
          <button id="addColumn" class="ghost">+ добавить столбец</button>
        </div>

        <div class="card">
          <h3>Фильтры</h3>
          <div id="filters" class="list"></div>
          <button id="addFilter" class="ghost">+ добавить фильтр</button>
        </div>

        <div class="card two-col">
          <div class="col">
            <h3>LIMIT</h3>
            <input id="limit" type="number" placeholder="например 100" />
          </div>
          <div class="col">
            <h3>OFFSET</h3>
            <input id="offset" type="number" placeholder="например 0" />
          </div>
        </div>
        <div class="muted">Подсказка: используйте <span class="kbd">Tab</span> / <span class="kbd">Enter</span> для быстрого ввода</div>
      </aside>
      <main class="right">
        <div class="card">
          <h3>Результат SQL</h3>
          <textarea id="sqlOut" class="sql-box" spellcheck="false"></textarea>
          <div id="paramsOut" class="muted"></div>
          <div id="warnings" class="muted danger"></div>
        </div>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
  </html>
